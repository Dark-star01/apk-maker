name: صناع الـAPK 2.0

# المنطق المعقد (دمج المانيفست وgradle، الأذونات، Kotlin، Compose، البلاجنات)
# موجود في .github/scripts/ عشان يبقى هذا الملف نظيف وبدون heredocs.

on:
  push:
    branches: [ main ]
    paths:
      - 'webapp/**'
      - 'splash/**'
      - 'native/**'
      - 'plugins/**'
      - 'assets_inject/**'
      - 'hooks/**'
      - 'config.json'
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ بناء APK
    runs-on: ubuntu-latest

    steps:
      # ════════════════ 1) التجهيز ════════════════
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: 🟢 تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ تجهيز Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔧 تثبيت الأدوات المطلوبة
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq unzip

      - name: ⚙️ قراءة config.json
        id: config
        run: |
          if ! jq empty config.json 2>/dev/null; then
            echo "❌ config.json فيه خطأ في الصيغة (فاصلة ناقصة أو علامة تنصيص؟)"
            exit 1
          fi
          APP_NAME=$(jq -r '.appName // "Web App"' config.json)
          APP_ID=$(jq -r '.appId // "com.dark.webapp"' config.json)
          VERSION=$(jq -r '.version // "1.0.0"' config.json)
          CAP_VERSION=$(jq -r '.capacitorVersion // "latest"' config.json)
          SPLASH_ENABLED=$(jq -r '.splash.enabled | if . == null then true else . end' config.json)
          ENV_ENABLED=$(jq -r '.env.enabled | if . == null then false else . end' config.json)
          printf 'app_name=%s\n' "$APP_NAME" >> "$GITHUB_OUTPUT"
          printf 'app_id=%s\n' "$APP_ID" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'cap_version=%s\n' "$CAP_VERSION" >> "$GITHUB_OUTPUT"
          printf 'splash_enabled=%s\n' "$SPLASH_ENABLED" >> "$GITHUB_OUTPUT"
          printf 'env_enabled=%s\n' "$ENV_ENABLED" >> "$GITHUB_OUTPUT"
          echo "📱 $APP_NAME | 🆔 $APP_ID | 🏷️ v$VERSION | 📦 Capacitor: $CAP_VERSION"

      # ════════════════ 2) تطبيق الويب ════════════════
      - name: 🔍 البحث عن ملف ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(ls -t webapp/*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف ZIP في مجلد webapp/"
            exit 1
          fi
          echo "✅ تم العثور على: $ZIP_FILE"
          printf 'zip_file=%s\n' "$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: 📦 فك ضغط التطبيق
        id: extract
        env:
          ZIP_FILE: ${{ steps.find_zip.outputs.zip_file }}
        run: |
          mkdir -p workspace
          unzip -q "$ZIP_FILE" -d workspace/extracted
          PROJECT_ROOT="workspace/extracted"
          if [ "$(ls workspace/extracted | wc -l)" -eq 1 ]; then
            INNER=$(ls workspace/extracted)
            if [ -d "workspace/extracted/$INNER" ]; then
              if [ -f "workspace/extracted/$INNER/index.html" ] || [ -f "workspace/extracted/$INNER/package.json" ]; then
                PROJECT_ROOT="workspace/extracted/$INNER"
              fi
            fi
          fi
          printf 'project_root=%s\n' "$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "✅ جذر المشروع: $PROJECT_ROOT"

      - name: 🔬 تحديد نوع المشروع
        id: detect
        env:
          PROJECT_ROOT: ${{ steps.extract.outputs.project_root }}
        run: |
          if [ -f "$PROJECT_ROOT/package.json" ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
            echo "🔬 مشروع Node"
          else
            echo "type=static" >> "$GITHUB_OUTPUT"
            echo "🔬 مشروع ثابت (HTML/CSS/JS)"
          fi

      - name: 🏗️ بناء تطبيق الويب
        if: steps.detect.outputs.type == 'node'
        working-directory: ${{ steps.extract.outputs.project_root }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if grep -q '"build"' package.json; then npm run build; fi

      - name: 📁 تجهيز مجلد www
        id: www
        env:
          PROJECT_ROOT: ${{ steps.extract.outputs.project_root }}
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
        run: |
          mkdir -p www
          CANDIDATES=("dist" "build" "out" "public" ".output/public" ".next/out" "www")
          if [ "$PROJECT_TYPE" = "node" ]; then
            FOUND=0
            for dir in "${CANDIDATES[@]}"; do
              if [ -f "$PROJECT_ROOT/$dir/index.html" ]; then
                cp -r "$PROJECT_ROOT/$dir"/* www/
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -eq 0 ]; then cp -r "$PROJECT_ROOT"/* www/ 2>/dev/null || true; fi
          else
            cp -r "$PROJECT_ROOT"/* www/
          fi
          if [ ! -f "www/index.html" ]; then
            echo "❌ index.html غير موجود!"
            exit 1
          fi
          echo "✅ مجلد www جاهز"

      # ════════════════ 3) حقن env و splash ════════════════
      - name: 🔐 تجهيز متغيرات البيئة (env.js)
        id: env_js
        if: steps.config.outputs.env_enabled == 'true'
        run: |
          # jq يهرّب القيم بشكل صحيح (tojson)، كل القيم تصير نصوصاً
          jq -r '"window.ENV = " + ((.env.vars // {}) | with_entries(.value |= tostring) | tojson) + ";"' config.json > www/env.js
          echo "✅ env.js:"
          cat www/env.js

      - name: 🎬 تجهيز شاشة البداية
        id: splash
        if: steps.config.outputs.splash_enabled == 'true'
        run: |
          jq '{
            appName: (.appName // "App"),
            subtitle: (.splash.subtitle // ""),
            footer: (.splash.footer // ""),
            duration: (.splash.duration // 2500),
            bg: (.splash.backgroundColor // "#0f0f1a"),
            text: (.splash.textColor // "#a29bfe"),
            accent: (.splash.accentColor // "#6c5ce7"),
            logo: "splash-logo.png"
          }' config.json | { printf 'window.__SPLASH__='; cat; printf ';\n'; } > www/splash-config.js
          cp splash/splash.js www/splash.js
          LOGO=$(jq -r '.splash.logoFile // "logo.png"' config.json)
          if [ -f "splash/$LOGO" ]; then
            cp "splash/$LOGO" www/splash-logo.png
            echo "🖼️ الشعار: splash/$LOGO"
          else
            echo "ℹ️ لا يوجد شعار (splash/$LOGO) — سيظهر حرف الاسم بدله"
          fi
          echo "✅ ملفات السبلاش جاهزة"

      - name: 💉 حقن السكربتات في index.html
        id: inject
        run: python3 .github/scripts/native.py inject

      # ════════════════ 4) Capacitor + أندرويد ════════════════
      - name: 📦 تثبيت Capacitor
        id: cap_install
        env:
          CAP_VERSION: ${{ steps.config.outputs.cap_version }}
        run: |
          npm install "@capacitor/core@$CAP_VERSION" "@capacitor/cli@$CAP_VERSION" "@capacitor/android@$CAP_VERSION"

      - name: 🚀 تهيئة Capacitor
        id: cap_init
        env:
          APP_NAME: ${{ steps.config.outputs.app_name }}
          APP_ID: ${{ steps.config.outputs.app_id }}
        run: |
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www

      - name: 🤖 إضافة منصة أندرويد
        id: cap_add
        run: npx cap add android

      - name: 🔧 إصلاح تعارض Kotlin
        id: kotlin_fix
        run: python3 .github/scripts/native.py kotlinfix

      - name: 🎨 تكوين الثيم الأصلي (إنهاء الوميض الأبيض)
        id: theme
        run: |
          # لون خلفية الـWebView من config.json
          jq '{
            appId: (.appId // "com.dark.webapp"),
            appName: (.appName // "Web App"),
            webDir: "www",
            backgroundColor: (.splash.backgroundColor // "#0f0f1a"),
            android: { backgroundColor: (.splash.backgroundColor // "#0f0f1a") }
          }' config.json > capacitor.config.json
          python3 .github/scripts/native.py theme

      - name: 🏷️ تطبيق رقم الإصدار على الـAPK
        id: version
        run: python3 .github/scripts/native.py version

      # ════════════════ 5) Native (كلها اختيارية) ════════════════
      - name: 🔎 [تشخيص] native قبل التطبيق
        run: python3 .github/scripts/native.py diag

      - name: 🧩 تطبيق ملفات Native
        id: native_files
        run: python3 .github/scripts/native.py files

      - name: 🔎 [تشخيص] native بعد التطبيق (يفشل إذا لم تصل الملفات)
        run: python3 .github/scripts/native.py diagcheck

      - name: 🔐 إضافة الأذونات
        id: native_perms
        run: python3 .github/scripts/native.py permissions

      - name: 📚 إضافة مكتبات Native
        id: native_deps
        run: python3 .github/scripts/native.py deps

      - name: 🟣 تفعيل Kotlin
        id: native_kotlin
        run: python3 .github/scripts/native.py kotlin

      - name: 🎨 تفعيل Jetpack Compose
        id: native_compose
        run: python3 .github/scripts/native.py compose

      - name: 🔌 تثبيت Capacitor Plugins
        id: plugins
        run: python3 .github/scripts/native.py plugins

      - name: 🔍 فحص أولي لملفات Kotlin
        id: validate
        run: python3 .github/scripts/native.py validate

      - name: 🪝 pre-build hook
        id: pre_hook
        env:
          APP_NAME: ${{ steps.config.outputs.app_name }}
          APP_ID: ${{ steps.config.outputs.app_id }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          if [ -f hooks/pre-build.sh ]; then
            echo "🪝 تشغيل hooks/pre-build.sh"
            bash hooks/pre-build.sh
          else
            echo "⏭️ لا يوجد hooks/pre-build.sh — تخطي"
          fi

      # ════════════════ 6) المزامنة والبناء ════════════════
      - name: 🔄 مزامنة الملفات
        id: sync
        run: npx cap sync android

      - name: 🔎 [تشخيص] native بعد cap sync (يفشل إذا اختفت الملفات)
        run: python3 .github/scripts/native.py diagcheck

      - name: 🗂️ حقن assets_inject
        id: assets
        run: python3 .github/scripts/native.py assets

      - name: 🔨 بناء APK
        id: gradle
        working-directory: ./android
        run: |
          set -o pipefail
          mkdir -p ../build_logs
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build_logs/gradle.log

      - name: 🪝 post-build hook
        id: post_hook
        env:
          APP_NAME: ${{ steps.config.outputs.app_name }}
          APP_ID: ${{ steps.config.outputs.app_id }}
          VERSION: ${{ steps.config.outputs.version }}
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          if [ -f hooks/post-build.sh ]; then
            echo "🪝 تشغيل hooks/post-build.sh"
            bash hooks/post-build.sh
          else
            echo "⏭️ لا يوجد hooks/post-build.sh — تخطي"
          fi

      # ════════════════ 7) المخرجات ════════════════
      - name: 📝 إنشاء BUILD_INFO.md
        id: info
        run: python3 .github/scripts/native.py info

      - name: 📦 تجهيز ملفات التسليم
        id: dist
        env:
          APP_NAME: ${{ steps.config.outputs.app_name }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          SAFE=$(printf '%s' "$APP_NAME" | tr -c 'A-Za-z0-9._-' '_' | sed 's/^_*$//')
          if [ -z "$SAFE" ]; then SAFE=app; fi
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$SAFE-v$VERSION.apk"
          cp BUILD_INFO.md dist/BUILD_INFO.md
          printf 'artifact_name=%s\n' "$SAFE-v$VERSION" >> "$GITHUB_OUTPUT"
          cat BUILD_INFO.md >> "$GITHUB_STEP_SUMMARY"
          echo "✅ الملفات الجاهزة:"
          ls -l dist

      - name: 📤 رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.artifact_name }}
          path: dist/
          retention-days: 30

      # ════════════════ 8) عند الفشل ════════════════
      - name: ❌ ملخص الفشل
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          FAILED=$(printf '%s' "$STEPS_JSON" | jq -r 'to_entries | map(select(.value.outcome == "failure")) | .[0].key // "unknown"')
          case "$FAILED" in
            config) HINT="config.json فيه خطأ في الصيغة" ;;
            find_zip) HINT="ضع ملف ZIP للتطبيق في مجلد webapp/" ;;
            extract) HINT="ملف ZIP تالف أو غير صالح" ;;
            www) HINT="index.html غير موجود داخل التطبيق" ;;
            inject) HINT="تعذر حقن السكربتات في www/index.html" ;;
            cap_install) HINT="تحقق من capacitorVersion في config.json" ;;
            native_files) HINT="ملفات native/ فيها مشكلة (راجع رسالة ❌ في اللوق)" ;;
            native_perms) HINT="صيغة الأذونات في config.json" ;;
            native_deps) HINT="صيغة extraDependencies في config.json" ;;
            native_kotlin) HINT="تعذر دمج إعدادات Kotlin في gradle" ;;
            native_compose) HINT="تعذر دمج إعدادات Compose في gradle" ;;
            plugins) HINT="بلاجن في plugins/ غير صالح (راجع package.json)" ;;
            gradle) HINT="فشل بناء Gradle (غالباً خطأ في كود Kotlin أو مكتبة)" ;;
            *) HINT="راجع لوق الخطوة الفاشلة" ;;
          esac
          {
            echo "## ❌ فشل البناء"
            echo
            echo "**الخطوة:** \`$FAILED\`"
            echo
            echo "**السبب المحتمل:** $HINT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build_logs/gradle.log ]; then
            {
              echo
              echo "**أهم أسطر الخطأ من Gradle:**"
              echo '```'
              grep -E '^e: |error:|What went wrong|Execution failed|Could not |not found' build_logs/gradle.log | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::error title=فشل البناء::الخطوة ($FAILED) — $HINT"

      - name: 📎 رفع سجلات الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/
          if-no-files-found: ignore
          retention-days: 7
